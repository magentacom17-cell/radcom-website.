<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Clean white background -->
  <rect width="500" height="500" fill="#FFFFFF" rx="16" />

  <!-- Monogram Group (RSI) -->
  <g id="rsi-monogram">
    <!-- Red Accent Corner on "I" -->
    <polygon points="398,82 445,82 445,129" fill="#DC1E28" />

    <!-- Blue Monogram Unified Graphic -->
    <!-- 1. Letter R (Stem, Bowl, Counter, and Base) -->
    <!-- R Outer & Counter -->
    <path fill="#193A8B" fill-rule="evenodd" d="
      M 55,82
      L 175,82
      C 214,82 238,102 238,131
      C 238,158 214,178 175,178
      L 101,178
      L 101,239
      L 155,239
      L 155,285
      L 55,285
      Z

      M 101,128
      L 170,128
      C 188,128 196,134 196,142
      C 196,150 188,156 170,156
      L 101,156
      Z
    " />

    <!-- 2. Letter S (Connecting from R waist into I base) -->
    <path fill="#193A8B" d="
      M 175,132
      L 295,132
      C 334,132 358,152 358,178
      C 358,206 332,224 290,224
      L 218,224
      C 200,224 190,230 190,238
      C 190,246 200,252 218,252
      L 399,252
      L 399,285
      L 215,285
      C 176,285 148,266 148,238
      C 148,210 174,192 216,192
      L 288,192
      C 306,192 316,186 316,178
      C 316,170 306,164 288,164
      L 175,164
      Z
    " />

    <!-- 3. Letter I (Right Vertical Pillar) -->
    <path fill="#193A8B" d="
      M 399,82
      L 399,285
      L 445,285
      L 445,129
      L 398,82
      Z
    " />
  </g>

  <!-- Typography: RADCOM SOLUSINDO INFORMATIKA -->
    <!-- Typography: RADCOM SOLUSINDO INFORMATIKA (Justified to exact monogram width: x=55 to 445 = 390px) -->
  <g id="typography" fill="#DC1E28" font-family="'Montserrat', 'Arial Black', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900">
    <text x="55" y="340" textLength="390" lengthAdjust="spacing" font-size="38">RADCOM</text>
    <text x="55" y="390" textLength="390" lengthAdjust="spacing" font-size="32">SOLUSINDO</text>
    <text x="55" y="436" textLength="390" lengthAdjust="spacing" font-size="27">INFORMATIKA</text>
  </g>
</svg>